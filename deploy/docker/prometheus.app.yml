global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: scheduler
    metrics_path: /metrics
    static_configs:
      - targets: ["scheduler:9091"]

  - job_name: workers
    metrics_path: /metrics
    static_configs:
      - targets: ["worker-1:9092", "worker-2:9092"]
