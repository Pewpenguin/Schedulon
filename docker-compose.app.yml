services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 5s
      timeout: 5s
      retries: 10

  scheduler:
    build:
      context: .
      dockerfile: deploy/docker/server.Dockerfile
    ports:
      - "50051:50051"
    expose:
      - "9091"
    command:
      - "-config=/configs/scheduler.yaml"
      - "-log-dir=/tmp"
      - "-db-type=postgres"
      - "-db-connection=host=postgres user=scheduler password=scheduler dbname=scheduler port=5432 sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  worker-1:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    hostname: worker-1
    environment:
      SCHEDULER_ADDR: scheduler:50051
    expose:
      - "9092"
    command:
      - "-addr=worker-1"
      - "-gpus=0"
      - "-models=mock-gpu"
      - "-memories=8192"
      - "-log-dir=/tmp"
      - "-work-dir=/tmp/worker"
      - "-artifact-dir=/tmp/worker/artifacts"
      - "-docker-socket=/var/run/docker.sock"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      scheduler:
        condition: service_started

  worker-2:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    hostname: worker-2
    environment:
      SCHEDULER_ADDR: scheduler:50051
    expose:
      - "9092"
    command:
      - "-addr=worker-2"
      - "-gpus=1"
      - "-models=mock-gpu"
      - "-memories=8192"
      - "-log-dir=/tmp"
      - "-work-dir=/tmp/worker"
      - "-artifact-dir=/tmp/worker/artifacts"
      - "-docker-socket=/var/run/docker.sock"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      scheduler:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/docker/prometheus.app.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - scheduler
      - worker-1
      - worker-2

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
